[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citadel-agent"
version = "0.1.0"
description = "A grounded support agent with hybrid retrieval, tool use, citation checks, and guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Citadel contributors" }]
keywords = ["agent", "rag", "guardrails", "bm25"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
citadel = "citadel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citadel = ["data/kb/*.md", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
